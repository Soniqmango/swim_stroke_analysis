[project]
name = "swimstroke"
version = "0.1.0"
description = "Computer-vision swim stroke analysis: stroke rate, stroke count, splits, DPS and turn times from pool-deck video."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",  # bundles an ffmpeg binary → browser-playable H.264 output
    # Pinned: mediapipe 1.0.x aborts on macOS arm64 ("Service is unavailable" in
    # DrishtiMetalHelper) for any pose model, CPU delegate included.
    "mediapipe==0.10.35",
    "pandas>=2.2",
    "pyarrow>=15",  # parquet storage for cached pose results
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swimstroke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
